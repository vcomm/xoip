<!doctypehtml><html lang="en"><meta charset="UTF-8"><meta name="viewport"content="width=device-width,initial-scale=1"><link rel="icon"type="image/x-icon"href="favicon.ico"><title>WebRTC Widget</title><style>:root{--primary-color:#2c3e50;--accent-color:#3498db;--danger-color:#e74c3c}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--primary-color);background-image:url('background.jpg');background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed}.container{max-width:100vw;height:100vh;padding:1rem}.welcome-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:1rem;background-color:rgba(255,255,255,.9);padding:2rem;border-radius:16px;box-shadow:0 4px 6px rgba(0,0,0,.1);max-width:600px;margin:auto}.room-controls{display:flex;gap:1rem;margin-top:1rem}.video-room{display:none;height:100%;position:relative}.remote-video{width:100%;height:100%;object-fit:cover;background:#000}.local-video{position:absolute;top:1rem;right:1rem;width:150px;height:100px;object-fit:cover;border:2px solid #fff;border-radius:8px;background:#000}.controls{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);display:flex;gap:1rem;background:rgba(0,0,0,.5);padding:1rem;border-radius:50px}button{padding:.8rem 1.5rem;border:none;border-radius:25px;background:var(--accent-color);color:#fff;cursor:pointer;font-size:1rem}button:disabled{opacity:.5;cursor:not-allowed;background-color:#ccc}button.danger{background:var(--danger-color)}input{padding:.8rem 1.5rem;border:1px solid #ddd;border-radius:25px;font-size:1rem;width:300px;max-width:100%}input:disabled{background-color:#f5f5f5;cursor:not-allowed}input.error{color:var(--danger-color);border-color:var(--danger-color)}.control-button{width:50px;height:50px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;position:relative}.control-button:hover::after{content:attr(data-tooltip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);padding:4px 8px;background:rgba(0,0,0,.8);color:#fff;border-radius:4px;font-size:12px;white-space:nowrap;margin-bottom:8px}#shareBtn:hover::after{content:"Share room link"}@media (max-width:768px){.local-video{width:100px;height:70px}.controls{bottom:1rem}}</style><script type="module"crossorigin src="index.js"></script><div class="container"><div id="welcomeScreen"class="welcome-screen"><h1>PsychoEmotional Video Call</h1><input id="roomId"placeholder="Room ID"><div class="room-controls"><button id="createBtn">Create Room</button> <button id="joinBtn">Join Room</button></div></div><div id="videoRoom"class="video-room"><video id="remoteVideo"class="remote-video"autoplay playsinline></video><video id="localVideo"class="local-video"autoplay playsinline muted></video><div class="controls"><button id="audioBtn"class="control-button">🎤</button> <button id="videoBtn"class="control-button">📷</button> <button id="shareBtn"class="control-button">📢</button> <button id="leaveBtn"class="control-button danger">📞</button></div></div></div>
